name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  parity:
    name: Embedded frontend and Go parity
    runs-on: docker
    container:
      image: container.local.sothr.com/library/golang:1.25-alpine
    env:
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium-browser
    steps:
      - name: Install dependencies
        run: apk add --no-cache git bash gcc musl-dev nodejs npm python3 just chromium font-noto
      - name: Checkout
        uses: Actions-Mirrors/forgejo-actions-checkout@v6
        with:
          fetch-depth: 0
      - name: Install ledger checker
        run: GOBIN=/usr/local/bin go install github.com/terva-sh/git-ticket/cmd/git-ticket@v0.23.0
      # Named separately from the gate below so a difference between the two
      # canvases reports as one, rather than as a failure somewhere in a
      # twelve-step release check. It runs the frontend half, so it needs the
      # dependencies installed; parity-check installs them again for itself,
      # which is the price of the earlier, clearer signal.
      - name: Install web dependencies
        run: just web-setup
      - name: Check the two canvases have not drifted
        run: just drift-check
      - name: Verify embedded parity
        run: just parity-check
      - name: Validate release configuration
        uses: Actions-Mirrors/goreleaser-action@v6
        with:
          version: '~> v2'
          args: check
