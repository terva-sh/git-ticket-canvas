<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>git-ticket canvas</title>
<style>
:root {
  color-scheme: dark light;
  --bg: #14161a;
  --grid: #1e2128;
  --grid-strong: #262a33;
  --panel: #1a1d23;
  --panel-2: #21252d;
  --line: #2d323c;
  --line-soft: #262a33;
  --ink: #e6e8ec;
  --ink-dim: #9aa2b1;
  --ink-faint: #6b7381;
  --accent: #6aa3f0;
  --accent-soft: #2a3a52;
  --edge: #465063;
  --danger: #e2686a;

  --s-draft: #7d8798;
  --s-ready: #5b9bf0;
  --s-in-progress: #dfa044;
  --s-blocked: #e2686a;
  --s-review: #a97ce0;
  --s-done: #56b283;
  --s-archived: #4a515e;

  --p-urgent: #e2686a;
  --p-high: #dfa044;
  --p-normal: #6b7381;
  --p-low: #4a515e;

  --card-w: 248px;
  --radius: 10px;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f5f7; --grid: #e8eaee; --grid-strong: #dcdfe6;
    --panel: #ffffff; --panel-2: #f7f8fa; --line: #d9dce3; --line-soft: #e6e9ee;
    --ink: #1a1d23; --ink-dim: #5b626f; --ink-faint: #868d9a;
    --accent: #2f6fd0; --accent-soft: #dbe7fa; --edge: #a8b0bf;
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font: 13px/1.45 var(--sans);
  background: var(--bg); color: var(--ink);
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

/* ---------- shell ---------- */
#app { display: grid; grid-template-rows: auto 1fr; height: 100%; min-width: 0; }
#toolbarRoot { min-width: 0; }
#statusFilters { flex-wrap: wrap; }
#toolbar .brand { overflow-wrap: anywhere; min-width: 0; }

#toolbar {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line);
  z-index: 20; flex-wrap: wrap;
}
.brand { font-weight: 600; letter-spacing: .2px; margin-right: 4px; }
.brand span { color: var(--ink-faint); font-weight: 400; font-family: var(--mono); font-size: 11px; }
.tool {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px;
  padding: 5px 10px; color: var(--ink-dim);
}
.tool:hover { color: var(--ink); border-color: var(--ink-faint); }
.tool.primary { background: var(--accent-soft); border-color: transparent; color: var(--ink); }
.tool[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); border-color: transparent; }
#search { min-width: 190px; }
input.tool, select.tool { color: var(--ink); }
.spacer { flex: 1; }
.chip-row { display: flex; gap: 4px; align-items: center; }
.chip {
  border: 1px solid var(--line); background: transparent; border-radius: 999px;
  padding: 3px 9px; font-size: 11px; color: var(--ink-faint); display: inline-flex; gap: 5px; align-items: center;
}
.chip[aria-pressed="true"] { color: var(--ink); border-color: currentColor; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.badge { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }
.badge.warn { color: var(--p-high); }
/* Server build identity. A native details keeps the label keyboard-reachable
   and the body absolutely positioned, so opening it never reflows the toolbar. */
.version { position: relative; margin-right: 4px; }
.version > summary { list-style: none; cursor: pointer; padding: 2px 4px; border-radius: 5px; user-select: text; }
.version > summary::-webkit-details-marker { display: none; }
.version > summary:hover, .version[open] > summary { color: var(--ink); background: var(--panel-2); }
.version > summary:focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 1px; }
.version-details {
  position: absolute; left: 0; top: calc(100% + 6px); z-index: 30; margin: 0;
  display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 10px;
  min-width: 220px; max-width: min(360px, calc(100vw - 24px)); padding: 8px 10px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 7px;
  font-family: var(--mono); font-size: 11px; color: var(--ink-dim); box-shadow: 0 6px 20px rgba(0,0,0,.18);
}
.version-details dt { color: var(--ink-faint); }
.version-details dd { margin: 0; color: var(--ink); overflow-wrap: anywhere; }

/* ---------- canvas ---------- */
#stage { position: relative; overflow: hidden; cursor: grab; }
#stage.panning { cursor: grabbing; }
#stage.linking { cursor: crosshair; }
#grid { position: absolute; inset: 0; pointer-events: none; }
#scene { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
#edges { position: absolute; overflow: visible; pointer-events: none; left: 0; top: 0; width: 1px; height: 1px; }

.card {
  position: absolute; width: var(--card-w);
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 9px 11px 10px;
  box-shadow: 0 1px 2px rgba(0,0,0,.25), 0 6px 18px -10px rgba(0,0,0,.5);
  cursor: default; user-select: none;
  border-left: 3px solid var(--status, var(--s-draft));
}
.card.unpinned { border-style: dashed; opacity: .82; }
.card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft), 0 8px 22px -10px rgba(0,0,0,.6); }
.card.dimmed { opacity: .18; }
.card.link-target { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.card.done .card-title, .card.archived .card-title { text-decoration: line-through; color: var(--ink-dim); }

.card-head { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
.card-id { font-family: var(--mono); font-size: 10px; color: var(--ink-faint); }
.card-type { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: var(--ink-faint); }
.card-title { font-size: 13px; font-weight: 550; line-height: 1.3; word-break: break-word; }
.card-meta { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-top: 7px; }
.pill {
  font-size: 10px; padding: 1px 6px; border-radius: 999px;
  background: var(--panel-2); border: 1px solid var(--line-soft); color: var(--ink-dim);
}
.pill.status { color: var(--status); border-color: color-mix(in srgb, var(--status) 40%, transparent); }
.pill.prio-urgent, .pill.prio-high { color: var(--p-high); border-color: color-mix(in srgb, var(--p-high) 40%, transparent); }
.pill.ready { color: var(--s-ready); border-color: color-mix(in srgb, var(--s-ready) 45%, transparent); }
.pill.blocked { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, transparent); }
.pill.claim { color: var(--s-in-progress); border-color: color-mix(in srgb, var(--s-in-progress) 40%, transparent); }
.pill.due { color: var(--ink-dim); }
.pill.due.late { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, transparent); }
.progress { height: 3px; background: var(--line-soft); border-radius: 2px; margin-top: 8px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--s-done); }

.handle {
  position: absolute; right: -7px; top: 50%; transform: translateY(-50%);
  width: 13px; height: 13px; border-radius: 50%;
  background: var(--panel-2); border: 2px solid var(--edge);
  opacity: 0; transition: opacity .12s; cursor: crosshair;
}
.card:hover .handle, .card.selected .handle { opacity: 1; }
.handle:hover { border-color: var(--accent); background: var(--accent); }

/* ---------- inspector ---------- */
#inspector {
  position: absolute; top: 0; right: 0; bottom: 0; width: 360px;
  background: var(--panel); border-left: 1px solid var(--line);
  display: flex; flex-direction: column; z-index: 15;
  transform: translateX(100%); transition: transform .16s ease;
}
#inspector.open { transform: none; }
.insp-head { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: flex-start; }
.insp-body { overflow-y: auto; padding: 4px 14px 40px; flex: 1; }
.insp-title {
  font-size: 14px; font-weight: 600; width: 100%; background: transparent;
  border: 1px solid transparent; border-radius: 6px; padding: 4px 6px; margin: -4px 0 2px -6px;
}
.insp-title:hover { border-color: var(--line); }
.insp-title:focus { border-color: var(--accent); outline: none; background: var(--panel-2); }
.field { margin: 12px 0; }
.field > label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--ink-faint); margin-bottom: 4px; }
.field .row { display: flex; gap: 6px; flex-wrap: wrap; }
.control {
  width: 100%; background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 8px;
}
.control:focus { outline: none; border-color: var(--accent); }
textarea.control { resize: vertical; min-height: 66px; font: inherit; }
.checkitem { display: flex; gap: 7px; align-items: flex-start; padding: 3px 0; }
.checkitem input { margin-top: 3px; flex: none; }
.checkitem span { flex: 1; word-break: break-word; }
.checkitem.done span { text-decoration: line-through; color: var(--ink-faint); }
.checkitem button { background: none; border: 0; color: var(--ink-faint); padding: 0 3px; visibility: hidden; }
.checkitem:hover button { visibility: visible; }
.checkitem button:hover { color: var(--danger); }
.entry { border-left: 2px solid var(--line); padding: 2px 0 2px 8px; margin: 6px 0; }
.entry .who { font-size: 10px; color: var(--ink-faint); font-family: var(--mono); }
.entry .what { white-space: pre-wrap; word-break: break-word; }
.linkline { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
.linkline a { color: var(--accent); text-decoration: none; font-family: var(--mono); font-size: 11px; cursor: pointer; }
.linkline .t { flex: 1; color: var(--ink-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.linkline button { background: none; border: 0; color: var(--ink-faint); }
.linkline button:hover { color: var(--danger); }
.insp-foot { padding: 10px 14px; border-top: 1px solid var(--line); display: flex; gap: 6px; }
.tool.danger:hover { color: var(--danger); border-color: var(--danger); }
.muted { color: var(--ink-faint); font-size: 11px; }

/* ---------- misc ---------- */
.sync-status {
  position: absolute; left: 12px; bottom: 34px; z-index: 20; max-width: min(60ch, calc(100% - 24px));
  padding: 8px 12px; background: var(--panel); color: var(--ink); border: 1px solid var(--danger);
  border-radius: var(--radius); pointer-events: none;
}
#toast {
  position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px);
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 14px; opacity: 0; transition: all .18s; pointer-events: none; z-index: 40;
  max-width: 60ch; box-shadow: 0 8px 30px -12px rgba(0,0,0,.7);
}
#toast.show { opacity: 1; transform: translateX(-50%); }
#toast.err { border-color: var(--danger); color: var(--danger); }
#hint {
  position: absolute; left: 12px; bottom: 10px; z-index: 10;
  color: var(--ink-faint); font-size: 11px; pointer-events: none;
}
#composer {
  position: absolute; z-index: 25; width: 248px;
  background: var(--panel); border: 1px solid var(--accent); border-radius: var(--radius);
  padding: 8px; box-shadow: 0 10px 30px -12px rgba(0,0,0,.7);
}
#composer input { width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
#composer input:focus { outline: none; border-color: var(--accent); }
#composer .muted { margin-top: 6px; display: block; }
[hidden] { display: none !important; }
</style>

<div id="app"></div>
